name: Publish signed SlayStats release

on:
  push:
    branches: ['publish/**']

permissions:
  contents: write

concurrency:
  group: publish-slaystats
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish release assets
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^publish/(?<tag>v[^/]+)/[0-9]+-[0-9]+$') {
              throw 'Unexpected release branch.'
          }
          $tag = $Matches.tag
          $manifest = 'assets/latest.json'
          $update = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ("v$($update.version)" -cne $tag) { throw 'Release tag and manifest version differ.' }
          $name = "SlayStats_$($update.version)_x64-setup.exe"
          $platform = $update.platforms.'windows-x86_64-nsis'
          if ($platform.url -cne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name") {
              throw 'Unexpected updater download URL.'
          }
          $setup = Join-Path 'assets' $name
          $signature = "$setup.sig"
          if ((Get-Content -LiteralPath $signature -Raw).Trim() -cne $platform.signature) {
              throw 'Installer signature and update manifest differ.'
          }
          $assets = @($setup, $signature, $manifest)
          $releases = gh release list --limit 100 --json tagName,isLatest,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          $releases = $releases | ConvertFrom-Json
          $latest = $releases | Where-Object isLatest | Select-Object -First 1
          if ($latest -and [semver]$update.version -le [semver]$latest.tagName.Substring(1)) {
              Write-Output "$($latest.tagName) is already available."
              return
          }
          $draft = $releases | Where-Object { $_.tagName -eq $tag -and $_.isDraft }
          if ($draft) {
              gh release upload $tag @assets --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
              gh release edit $tag --draft=false --latest
          } else {
              gh release create $tag @assets --latest --target $env:RELEASE_DEFAULT_BRANCH --title "SlayStats $tag" --notes 'Closed alpha for Windows x64.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Remove the temporary release branch
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
